<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Join Remote Session</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card" style="max-width:700px;">
    <h1>Join remote session</h1>
    <p class="subtitle">You'll connect only after the host approves your request.</p>

    <div id="preConnect">
      <button id="requestBtn">Request access</button>
    </div>

    <div id="waiting" class="status" style="display:none;">Waiting for host approval…</div>

    <video id="remoteVideo" autoplay style="display:none;"></video>
    <div id="result" class="status"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
