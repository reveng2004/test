<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard — Remote Access</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card" style="max-width:560px;">
    <div class="user-row">
      <img id="avatar" src="" alt="">
      <div>
        <strong id="name"></strong><br>
        <span class="status" id="email"></span>
      </div>
    </div>

    <h1>Share your screen</h1>
    <p class="subtitle">Generate a one-time link. The session only starts after you explicitly approve the person who opens it.</p>

    <button id="createLinkBtn">Generate secure link</button>
    <div id="linkBox" style="display:none;">
      <div class="link-box" id="linkText"></div>
      <div class="status" id="expiry"></div>
      <div class="spacer"></div>
      <button class="secondary" id="revokeBtn">Revoke link</button>
    </div>

    <div id="approvalBox" class="approval-box" style="display:none;">
      <strong>Someone wants to view your screen</strong>
      <p class="status">Only approve this if you recognize the request.</p>
      <div class="row">
        <button id="approveBtn">Approve</button>
        <button id="denyBtn" class="danger">Deny</button>
      </div>
    </div>

    <div id="sessionStatus" class="status"></div>
    <video id="previewVideo" autoplay muted style="display:none; margin-top:16px;"></video>

    <div class="spacer"></div>
    <a href="/auth/logout"><button class="secondary">Sign out</button></a>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
